<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1917">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6e6b64"/></marker>
    <style>
      .box{fill:#fff;stroke:#cdc7ba;stroke-width:1.2}
      .key{fill:#fdf6d8;stroke:#d9bd4f;stroke-width:1.2}
      .zone{fill:#f3f1eb;stroke:#e4e0d7}
      .lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;fill:#6e6b64}
      .t{font-weight:600}
      .s{font-size:12.5px;fill:#6e6b64}
      .ln{stroke:#6e6b64;stroke-width:1.3;fill:none}
      .loop{stroke:#c9a227;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="920" height="530" fill="#fff"/>

  <!-- Inputs -->
  <rect class="zone" x="20" y="20" width="250" height="400" rx="10"/>
  <text class="lbl" x="38" y="44">CONTEXT BRIEFS</text>
  <text class="s" x="38" y="64">one short brief per source,</text>
  <text class="s" x="38" y="81">written about the person</text>
  <rect class="box" x="38" y="98" width="214" height="52" rx="8"/><text x="54" y="129">Profile and job title</text>
  <rect class="box" x="38" y="162" width="214" height="52" rx="8"/><text x="54" y="193">Collaboration signals</text>
  <rect class="box" x="38" y="226" width="214" height="52" rx="8"/><text x="54" y="257">Email and meetings</text>
  <rect class="box" x="38" y="290" width="214" height="52" rx="8"/><text x="54" y="321">Documents</text>
  <text class="s" x="38" y="372">Microsoft 365 sources only,</text>
  <text class="s" x="38" y="389">inside the customer's tenant</text>
  <path class="ln" d="M270 220h52" marker-end="url(#a)"/>

  <!-- Debate -->
  <rect class="zone" x="326" y="20" width="370" height="400" rx="10"/>
  <text class="lbl" x="344" y="44">ONE PROMPT, FOUR TAXONOMISTS</text>
  <text class="s" x="344" y="64">each trusts different signals and critiques differently;</text>
  <text class="s" x="344" y="81">they debate, then decide together</text>
  <rect class="key" x="426" y="182" width="170" height="76" rx="38"/>
  <text class="t" x="511" y="214" text-anchor="middle">Candidate skill</text>
  <text class="s" x="511" y="234" text-anchor="middle">one per turn</text>
  <rect class="box" x="346" y="98" width="150" height="56" rx="8"/><text class="t" x="421" y="132" text-anchor="middle">Taxonomist A</text>
  <rect class="box" x="526" y="98" width="150" height="56" rx="8"/><text class="t" x="601" y="132" text-anchor="middle">Taxonomist B</text>
  <rect class="box" x="346" y="294" width="150" height="56" rx="8"/><text class="t" x="421" y="328" text-anchor="middle">Taxonomist C</text>
  <rect class="box" x="526" y="294" width="150" height="56" rx="8"/><text class="t" x="601" y="328" text-anchor="middle">Taxonomist D</text>
  <path class="ln" d="M440 154l22 28M582 154l-22 28M440 294l22-34M582 294l-22-34"/>
    <path class="ln" d="M696 220h28"/><path class="ln" d="M724 160v120"/><path class="ln" d="M724 160h24" marker-end="url(#a)"/><path class="ln" d="M724 280h24" marker-end="url(#a)"/>

  <!-- Verdict -->
  <rect class="box" x="752" y="120" width="150" height="80" rx="8"/>
  <text class="t" x="827" y="152" text-anchor="middle">Accepted</text>
  <text class="s" x="827" y="172" text-anchor="middle">mapped to the</text>
  <text class="s" x="827" y="188" text-anchor="middle">skills taxonomy</text>
  <rect class="box" x="752" y="240" width="150" height="80" rx="8"/>
  <text class="t" x="827" y="272" text-anchor="middle">Rejected</text>
  <text class="s" x="827" y="292" text-anchor="middle">4/4, or 3/4 with</text>
  <text class="s" x="827" y="308" text-anchor="middle">a clear reason</text>
  
  <!-- Loop -->
  <path class="loop" d="M827 320v120H511v-178" marker-end="url(#a)"/>
  <rect x="560" y="452" width="270" height="56" rx="8" fill="#fff"/>
  <text class="t" x="566" y="472">Carried into later rounds</text>
  <text class="s" x="566" y="491">a fake backtrack on GPT-3.5, so similar</text>
  <text class="s" x="566" y="507">skills are not argued again from scratch</text>
</svg>
