# Build with Astro and deploy to GitHub Pages (PLAN §5, §10a item 6).
# Repo setting needed once: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  # Monthly rebuild keeps computed role durations ("2 yrs 10 mos") current between pushes.
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push doesn't cancel one already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Type and content check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
