# Pull requests: type/content check + build, no deploy. A broken front-matter field fails here
# with a readable message, before anything reaches the live site.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type and content check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Upload build for review
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7
