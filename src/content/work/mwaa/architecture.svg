<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1a1917">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6e6b64"/></marker>
    <style>
      .box{fill:#fff;stroke:#cdc7ba;stroke-width:1.2}
      .key{fill:#fdf6d8;stroke:#d9bd4f;stroke-width:1.2}
      .zone{fill:#f3f1eb;stroke:#e4e0d7}
      .env{fill:none;stroke:#8a8579;stroke-width:1.3;stroke-dasharray:6 5}
      .lbl{font-size:11.5px;font-weight:600;letter-spacing:.09em;fill:#6e6b64}
      .t{font-weight:600}
      .s{font-size:12.5px;fill:#6e6b64}
      .ln{stroke:#6e6b64;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="920" height="600" fill="#fff"/>

  <!-- Control plane -->
  <rect class="zone" x="20" y="20" width="880" height="120" rx="10"/>
  <text class="lbl" x="38" y="44">CONTROL PLANE · SERVERLESS</text>
  <rect class="box" x="38" y="60" width="170" height="62" rx="8"/>
  <text class="t" x="123" y="87" text-anchor="middle">Customer</text>
  <text class="s" x="123" y="106" text-anchor="middle">Console, CLI, API</text>
  <rect class="box" x="258" y="60" width="170" height="62" rx="8"/>
  <text class="t" x="343" y="87" text-anchor="middle">API Gateway</text>
  <text class="s" x="343" y="106" text-anchor="middle">IAM-authorized calls</text>
  <rect class="box" x="478" y="60" width="170" height="62" rx="8"/>
  <text class="t" x="563" y="87" text-anchor="middle">Lambda</text>
  <text class="s" x="563" y="106" text-anchor="middle">create, update, operate</text>
  <rect class="box" x="698" y="60" width="184" height="62" rx="8"/>
  <text class="t" x="790" y="87" text-anchor="middle">DynamoDB</text>
  <text class="s" x="790" y="106" text-anchor="middle">service and entity state</text>
  <path class="ln" d="M208 91h46" marker-end="url(#a)"/>
  <path class="ln" d="M428 91h46" marker-end="url(#a)"/>
  <path class="ln" d="M648 91h46" marker-end="url(#a)"/>
  <path class="ln" d="M563 122v52" marker-end="url(#a)"/>
  <text class="s" x="573" y="156">provisions each environment</text>

  <!-- Environment -->
  <rect class="env" x="20" y="180" width="880" height="270" rx="12"/>
  <text class="lbl" x="38" y="204">ONE AIRFLOW ENVIRONMENT · CREATED, OPERATED AND BILLED ON ITS OWN</text>

  <rect class="zone" x="38" y="218" width="400" height="214" rx="10"/>
  <text class="lbl" x="56" y="242">CUSTOMER VPC · PRIVATE SUBNETS</text>
  <rect class="box" x="56" y="256" width="170" height="62" rx="8"/>
  <text class="t" x="141" y="283" text-anchor="middle">Scheduler</text>
  <text class="s" x="141" y="302" text-anchor="middle">Fargate containers</text>
  <rect class="box" x="250" y="256" width="170" height="62" rx="8"/>
  <text class="t" x="335" y="283" text-anchor="middle">Workers</text>
  <text class="s" x="335" y="302" text-anchor="middle">Fargate, autoscaled</text>
  <rect class="box" x="56" y="346" width="364" height="66" rx="8"/>
  <text class="t" x="238" y="373" text-anchor="middle">VPC endpoints</text>
  <text class="s" x="238" y="393" text-anchor="middle">private path to the web server and the database</text>
  <path class="ln" d="M141 318v24" marker-end="url(#a)"/>
  <path class="ln" d="M335 318v24" marker-end="url(#a)"/>

  <rect class="zone" x="482" y="218" width="400" height="214" rx="10"/>
  <text class="lbl" x="500" y="242">SERVICE VPC · RUN BY AWS</text>
  <rect class="box" x="500" y="256" width="364" height="62" rx="8"/>
  <text class="t" x="682" y="283" text-anchor="middle">Airflow web server</text>
  <text class="s" x="682" y="302" text-anchor="middle">IAM sign-in and SSO to the Airflow UI</text>
  <rect class="key" x="500" y="346" width="364" height="66" rx="8"/>
  <text class="t" x="682" y="373" text-anchor="middle">Aurora PostgreSQL, one per environment</text>
  <text class="s" x="682" y="393" text-anchor="middle">an outage stays inside this environment</text>
  <path class="ln" d="M420 370h76" marker-end="url(#a)"/>
  <path class="ln" d="M420 384c40 0 40-97 76-97" marker-end="url(#a)"/>

  <!-- Shared services -->
  <text class="lbl" x="38" y="490">AWS SERVICES EVERY ENVIRONMENT USES</text>
  <rect class="box" x="38" y="504" width="196" height="62" rx="8"/>
  <text class="t" x="136" y="531" text-anchor="middle">S3</text>
  <text class="s" x="136" y="550" text-anchor="middle">DAGs and plugins</text>
  <rect class="box" x="254" y="504" width="196" height="62" rx="8"/>
  <text class="t" x="352" y="531" text-anchor="middle">SQS</text>
  <text class="s" x="352" y="550" text-anchor="middle">task queue</text>
  <rect class="box" x="470" y="504" width="196" height="62" rx="8"/>
  <text class="t" x="568" y="531" text-anchor="middle">CloudWatch</text>
  <text class="s" x="568" y="550" text-anchor="middle">logs and metrics</text>
  <rect class="box" x="686" y="504" width="196" height="62" rx="8"/>
  <text class="t" x="784" y="531" text-anchor="middle">KMS</text>
  <text class="s" x="784" y="550" text-anchor="middle">encryption keys</text>
</svg>
