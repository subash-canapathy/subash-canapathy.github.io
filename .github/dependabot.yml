version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    # TypeScript major versions wait until @astrojs/check supports them (its peer range);
    # otherwise `npm ci` fails on the bump PR. Minor and patch updates still come through.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
